name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Unit tests - stub-based, platform-independent (run on Linux only for speed)
  unit-tests:
    name: Unit Tests (Stub-based)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential nlohmann-json3-dev

    - name: Configure CMake
      working-directory: tests
      run: |
        # Use system-installed nlohmann-json
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
          -DNLOHMANN_JSON_DIR=/usr/include

    - name: Build tests
      working-directory: tests
      run: cmake --build build --config Release

    - name: Run unit tests
      working-directory: tests
      run: ./build/TestRunner --success

  # Sanitizer tests - Linux only (ASan + UBSan + LeakSan)
  # macOS ARM has limited sanitizer support, Linux catches same bugs
  sanitizer-tests:
    name: Sanitizer Tests (ASan + UBSan + LeakSan)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential clang nlohmann-json3-dev

    # Clang, deliberately. tests/CMakeLists.txt adds -fsanitize=integer and
    # -fsanitize=float-divide-by-zero only for Clang, because `integer` is a
    # Clang group alias GCC rejects. Under the default GCC this job ran
    # address+undefined only, so the unsigned-overflow and implicit-truncation
    # checks the run step advertises were never actually enabled.
    - name: Configure CMake with sanitizers
      working-directory: tests
      env:
        CC: clang
        CXX: clang++
      run: |
        cmake -S . -B build_san \
          -DCMAKE_BUILD_TYPE=Debug \
          -DLLOYAL_ENABLE_SANITIZERS=ON \
          -DNLOHMANN_JSON_DIR=/usr/include

    - name: Build tests with sanitizers
      working-directory: tests
      run: cmake --build build_san --config Debug

    - name: Run tests with ASan + UBSan + LeakSan
      working-directory: tests
      env:
        ASAN_OPTIONS: detect_leaks=1
      run: |
        set -o pipefail
        echo "Running with AddressSanitizer, UBSan, Integer, Float, and LeakSanitizer..."
        ./build_san/TestRunner --success 2>&1 | tee sanitizer_output.txt
        # Check for any runtime errors (warnings are ok, errors are not)
        if grep -q "ERROR: " sanitizer_output.txt; then
          echo "❌ Sanitizer found errors!"
          exit 1
        fi
        echo "✅ No sanitizer errors"

  integration-tests:
    name: Integration Tests (Linux)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential nlohmann-json3-dev

    - name: Read llama.cpp version
      id: llama_version
      run: |
        LLAMA_VERSION=$(grep -v '^#' .llama-cpp-version | head -n1 | tr -d '[:space:]')
        echo "version=$LLAMA_VERSION" >> $GITHUB_OUTPUT
        echo "Using llama.cpp version: $LLAMA_VERSION"

    - name: Checkout llama.cpp
      run: |
        git clone --depth 1 --branch ${{ steps.llama_version.outputs.version }} https://github.com/ggml-org/llama.cpp
        echo "Checked out llama.cpp at:"
        cd llama.cpp && git log -1 --oneline

    - name: Cache llama.cpp build
      uses: actions/cache@v4
      with:
        path: llama.cpp/build
        key: llama-linux-${{ runner.arch }}-${{ steps.llama_version.outputs.version }}
        restore-keys: |
          llama-linux-${{ runner.arch }}-

    - name: Build llama.cpp
      run: |
        chmod +x .github/scripts/build-llama.sh
        LLAMA_DIR=llama.cpp .github/scripts/build-llama.sh

    # mtmd is the multimodal codec behind <lloyal/mtmd.hpp>. build-llama.sh
    # keeps LLAMA_BUILD_TOOLS=OFF, so tools/mtmd declares no targets; enabling
    # it here and building ONLY the mtmd target adds the library without the
    # tool CLIs. Same build tree as libllama — the integration runner links
    # both, and two trees would mean two backend registries in one process.
    - name: Build mtmd (multimodal codec)
      run: |
        cmake -B llama.cpp/build -S llama.cpp \
          -DLLAMA_BUILD_TOOLS=ON \
          -DMTMD_VIDEO=OFF
        cmake --build llama.cpp/build --target mtmd -j$(nproc)
        ls -lh llama.cpp/build/tools/mtmd/libmtmd.* 2>/dev/null || \
          ls -lh llama.cpp/build/tools/mtmd/

    - name: Cache test models
      uses: actions/cache@v4
      with:
        path: tests/fixtures/*.gguf
        key: test-models-v3-${{ hashFiles('.github/workflows/tests.yml', 'tests/fixtures/*-models.sha256') }}
        restore-keys: |
          test-models-v3-

    - name: Download test models
      working-directory: tests
      run: |
        mkdir -p fixtures

        # Download SmolLM2-1.7B (1GB) for all integration tests
        if [ ! -f fixtures/SmolLM2-1.7B-Instruct-Q4_K_M.gguf ]; then
          echo "Downloading SmolLM2-1.7B-Instruct-Q4_K_M.gguf (1GB)..."
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://huggingface.co/HuggingFaceTB/SmolLM2-1.7B-Instruct-GGUF/resolve/main/smollm2-1.7b-instruct-q4_k_m.gguf" \
            -o fixtures/SmolLM2-1.7B-Instruct-Q4_K_M.gguf

          echo "Verifying SmolLM2-1.7B-Instruct-Q4_K_M.gguf..."
          if ! head -c 4 fixtures/SmolLM2-1.7B-Instruct-Q4_K_M.gguf | grep -q "GGUF"; then
            echo "ERROR: Downloaded file is not a valid GGUF file"
            head -c 32 fixtures/SmolLM2-1.7B-Instruct-Q4_K_M.gguf | xxd
            rm -f fixtures/SmolLM2-1.7B-Instruct-Q4_K_M.gguf
            exit 1
          fi
          echo "✓ SmolLM2-1.7B-Instruct-Q4_K_M.gguf verified"
        else
          echo "✓ Using cached SmolLM2-1.7B-Instruct-Q4_K_M.gguf"
        fi

        # Download nomic-embed-text-v1.5 (67MB) for embedding tests
        if [ ! -f fixtures/nomic-embed-text-v1.5.Q4_K_M.gguf ]; then
          echo "Downloading nomic-embed-text-v1.5.Q4_K_M.gguf (67MB)..."
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://huggingface.co/nomic-ai/nomic-embed-text-v1.5-GGUF/resolve/main/nomic-embed-text-v1.5.Q4_K_M.gguf" \
            -o fixtures/nomic-embed-text-v1.5.Q4_K_M.gguf

          echo "Verifying nomic-embed-text-v1.5.Q4_K_M.gguf..."
          if ! head -c 4 fixtures/nomic-embed-text-v1.5.Q4_K_M.gguf | grep -q "GGUF"; then
            echo "ERROR: Downloaded file is not a valid GGUF file"
            head -c 32 fixtures/nomic-embed-text-v1.5.Q4_K_M.gguf | xxd
            rm -f fixtures/nomic-embed-text-v1.5.Q4_K_M.gguf
            exit 1
          fi
          echo "✓ nomic-embed-text-v1.5.Q4_K_M.gguf verified"
        else
          echo "✓ Using cached nomic-embed-text-v1.5.Q4_K_M.gguf"
        fi

        echo "All test models ready"

    - name: Download and verify multimodal model pairs
      working-directory: tests
      run: |
        set -euo pipefail
        download_pair() {
          local repo="$1" revision="$2" manifest="$3"
          while read -r expected file; do
            if ! printf '%s  %s\n' "$expected" "fixtures/$file" | sha256sum -c --status; then
              curl -fsSL --retry 3 --retry-delay 2 \
                "https://huggingface.co/$repo/resolve/$revision/$file" \
                -o "fixtures/$file.part"
              printf '%s  %s\n' "$expected" "fixtures/$file.part" | sha256sum -c -
              mv "fixtures/$file.part" "fixtures/$file"
            fi
          done < "$manifest"
        }
        download_pair unsloth/Qwen3.5-4B-GGUF \
          e87f176479d0855a907a41277aca2f8ee7a09523 fixtures/vision-models.sha256
        download_pair ggml-org/Qwen3-ASR-0.6B-GGUF \
          928ab958557df9aa2ef1c93e0e83c7ad0933fae2 fixtures/asr-models.sha256
        # EmbeddingGemma 2's projector is BF16, never F16: the model card says
        # not to run it in float16.
        download_pair unsloth/embeddinggemma-2-GGUF \
          031f0d4b35536f69ab3509d4893c923264fcf253 fixtures/embedding-models.sha256

    - name: Configure CMake for integration tests
      working-directory: tests
      run: |
        cmake -S . -B build_integration \
          -DLLOYAL_BUILD_INTEGRATION_TESTS=ON \
          -DLLAMA_CPP_DIR=${{ github.workspace }}/llama.cpp \
          -DNLOHMANN_JSON_DIR=/usr/include \
          -DLLOYAL_ENABLE_UBSAN_INTEGRATION=ON \
          -DCMAKE_BUILD_TYPE=Release

    - name: Build integration tests
      working-directory: tests
      run: cmake --build build_integration --config Release

    - name: Run integration tests
      working-directory: tests
      env:
        LLAMA_TEST_MODEL: ${{ github.workspace }}/tests/fixtures/SmolLM2-1.7B-Instruct-Q4_K_M.gguf
        # UBSan recovers by default: without this a finding prints and the run passes.
        UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      run: |
        set -o pipefail
        echo "Running integration tests with SmolLM2-1.7B..."
        echo "Model path: $LLAMA_TEST_MODEL"
        ls -lh "$LLAMA_TEST_MODEL"
        ./build_integration/IntegrationRunner --success \
          --test-case-exclude="*Embedding*,*multimodal*,audio:*,decode failure: an image*" 2>&1 | tee test_output.txt
        # Fail if no tests actually executed (all filtered/skipped)
        if grep -qE "test cases:.*\| 0 passed \| 0 failed \|" test_output.txt; then
          echo "::error::No tests executed — all were skipped or filtered out"
          exit 1
        fi

    - name: Run embedding tests
      working-directory: tests
      env:
        LLAMA_TEST_MODEL: ${{ github.workspace }}/tests/fixtures/SmolLM2-1.7B-Instruct-Q4_K_M.gguf
        LLAMA_EMBED_MODEL: ${{ github.workspace }}/tests/fixtures/nomic-embed-text-v1.5.Q4_K_M.gguf
        UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      run: |
        set -o pipefail
        echo "Running embedding tests with nomic-embed-text-v1.5..."
        echo "Embed model path: $LLAMA_EMBED_MODEL"
        ls -lh "$LLAMA_EMBED_MODEL"
        ./build_integration/IntegrationRunner --success \
          --test-case="*Embedding*" 2>&1 | tee test_output.txt
        # Fail if no tests actually executed (all filtered/skipped)
        if grep -qE "test cases:.*\| 0 passed \| 0 failed \|" test_output.txt; then
          echo "::error::No tests executed — all were skipped or filtered out"
          exit 1
        fi

    - name: Run embedding tests (EmbeddingGemma 2)
      working-directory: tests
      env:
        LLAMA_TEST_MODEL: ${{ github.workspace }}/tests/fixtures/SmolLM2-1.7B-Instruct-Q4_K_M.gguf
        # A model whose output head is not its hidden width: 768 out of 512.
        LLAMA_EMBED_MODEL: ${{ github.workspace }}/tests/fixtures/embeddinggemma-2-Q8_0.gguf
        UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      run: |
        set -o pipefail
        ./build_integration/IntegrationRunner --success \
          --test-case="*Embedding*" 2>&1 | tee test_output.txt
        if grep -qE "test cases:.*\| 0 passed \| 0 failed \|" test_output.txt; then
          echo "::error::No tests executed — all were skipped or filtered out"
          exit 1
        fi

    - name: Run image projection tests (Qwen3.5-4B)
      working-directory: tests
      env:
        LLAMA_TEST_MODEL: ${{ github.workspace }}/tests/fixtures/Qwen3.5-4B-Q4_K_M.gguf
        LLAMA_MMPROJ_MODEL: ${{ github.workspace }}/tests/fixtures/mmproj-F16.gguf
        LLAMA_N_GPU_LAYERS: "0"
        LLOYAL_VL_STRICT: "1"
        UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      run: |
        set -o pipefail
        echo "Running image projection tests with Qwen3.5-4B..."
        echo "Model path: $LLAMA_TEST_MODEL"
        echo "Projector path: $LLAMA_MMPROJ_MODEL"
        ls -lh "$LLAMA_TEST_MODEL" "$LLAMA_MMPROJ_MODEL"
        # The embedding-rail failure case needs the projector too; the plain
        # run above skips it, so this run must select it by name. The
        # fast-forward cases run here again because Qwen3.5 is hybrid
        # recurrent: a fork shares the parent's recurrent cell until one of
        # them decodes, which SmolLM2's attention-only cache never exercises.
        ./build_integration/IntegrationRunner --success \
          --test-case="*multimodal*,decode failure: an image*,fast forward:*" 2>&1 | tee test_output.txt
        # Fail if no tests actually executed (all filtered/skipped)
        if grep -qE "test cases:.*\| 0 passed \| 0 failed \|" test_output.txt; then
          echo "::error::No tests executed — all were skipped or filtered out"
          exit 1
        fi

    - name: Run audio integration tests
      working-directory: tests
      env:
        LLAMA_TEST_MODEL: ${{ github.workspace }}/tests/fixtures/Qwen3-ASR-0.6B-Q8_0.gguf
        LLAMA_MMPROJ_MODEL: ${{ github.workspace }}/tests/fixtures/mmproj-Qwen3-ASR-0.6B-Q8_0.gguf
        LLAMA_N_GPU_LAYERS: "0"
        LLOYAL_ASR_TEST: "1"
        UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      run: |
        set -euo pipefail
        ./build_integration/IntegrationRunner --success \
          --test-case="audio:*" 2>&1 | tee audio_output.txt
        if ! grep -qE 'test cases:.*\| +[1-9][0-9]* passed \| +0 failed \|' audio_output.txt; then
          echo "::error::No passing audio cases were reported"
          exit 1
        fi

    - name: Run multimodal embedding tests (EmbeddingGemma 2)
      working-directory: tests
      env:
        LLAMA_TEST_MODEL: ${{ github.workspace }}/tests/fixtures/embeddinggemma-2-Q8_0.gguf
        LLAMA_MMPROJ_MODEL: ${{ github.workspace }}/tests/fixtures/mmproj-BF16.gguf
        LLAMA_N_GPU_LAYERS: "0"
        LLOYAL_EMBED_MM_TEST: "1"
        UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      run: |
        set -euo pipefail
        ./build_integration/IntegrationRunner --success \
          --test-case="embedding multimodal:*" 2>&1 | tee embedding_mm_output.txt
        if ! grep -qE 'test cases:.*\| +[1-9][0-9]* passed \| +0 failed \|' embedding_mm_output.txt; then
          echo "::error::No passing multimodal embedding cases were reported"
          exit 1
        fi

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: integration-test-results-macos
        path: |
          tests/build_integration/
          tests/audio_output.txt
          tests/embedding_mm_output.txt

  # AddressSanitizer on real weights. The stub tier's sanitizer job never
  # touches a KV cache, a recurrent cell or llama.cpp's own allocations, and
  # the UBSan integration build excludes ASan because a plain libllama is not
  # instrumented. Here llama.cpp is built WITH ASan too, so both sides of the
  # boundary are, and the branch operations that move state between slots
  # (fork, prune, retainOnly, fast_forward) run under it on both kinds of
  # memory: SmolLM2's attention-only cache and Qwen3.5's hybrid recurrent one.
  integration-asan:
    name: Integration Tests under ASan (Linux)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential nlohmann-json3-dev

    - name: Read llama.cpp version
      id: llama_version
      run: |
        LLAMA_VERSION=$(grep -v '^#' .llama-cpp-version | head -n1 | tr -d '[:space:]')
        echo "version=$LLAMA_VERSION" >> $GITHUB_OUTPUT

    - name: Checkout llama.cpp
      run: git clone --depth 1 --branch ${{ steps.llama_version.outputs.version }} https://github.com/ggml-org/llama.cpp

    - name: Cache the ASan llama.cpp build
      uses: actions/cache@v4
      with:
        path: llama.cpp/build-asan
        key: llama-linux-asan-${{ runner.arch }}-${{ steps.llama_version.outputs.version }}

    # Static archives linked straight into the runner (the plain build tree
    # tests/CMakeLists.txt accepts), every one compiled with ASan. OpenMP off:
    # the static link adds no -fopenmp, and ggml's threadpool serves the same.
    - name: Build llama.cpp with AddressSanitizer
      run: |
        cmake -B llama.cpp/build-asan -S llama.cpp \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DBUILD_SHARED_LIBS=OFF \
          -DLLAMA_SANITIZE_ADDRESS=ON \
          -DGGML_OPENMP=OFF \
          -DLLAMA_BUILD_TOOLS=ON -DMTMD_VIDEO=OFF \
          -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_SERVER=OFF \
          -DLLAMA_BUILD_APP=OFF -DLLAMA_BUILD_COMMON=ON -DLLAMA_CURL=OFF
        cmake --build llama.cpp/build-asan --target llama mtmd llama-common -j$(nproc)

    - name: Cache test models
      uses: actions/cache@v4
      with:
        path: tests/fixtures/*.gguf
        key: test-models-v3-${{ hashFiles('.github/workflows/tests.yml', 'tests/fixtures/*-models.sha256') }}
        restore-keys: |
          test-models-v3-

    - name: Download and verify models
      working-directory: tests
      run: |
        set -euo pipefail
        mkdir -p fixtures
        if [ ! -f fixtures/SmolLM2-1.7B-Instruct-Q4_K_M.gguf ]; then
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://huggingface.co/HuggingFaceTB/SmolLM2-1.7B-Instruct-GGUF/resolve/main/smollm2-1.7b-instruct-q4_k_m.gguf" \
            -o fixtures/SmolLM2-1.7B-Instruct-Q4_K_M.gguf
        fi
        while read -r expected file; do
          if ! printf '%s  %s\n' "$expected" "fixtures/$file" | sha256sum -c --status; then
            curl -fsSL --retry 3 --retry-delay 2 \
              "https://huggingface.co/unsloth/Qwen3.5-4B-GGUF/resolve/e87f176479d0855a907a41277aca2f8ee7a09523/$file" \
              -o "fixtures/$file.part"
            printf '%s  %s\n' "$expected" "fixtures/$file.part" | sha256sum -c -
            mv "fixtures/$file.part" "fixtures/$file"
          fi
        done < fixtures/vision-models.sha256

    - name: Configure the runner with AddressSanitizer
      working-directory: tests
      run: |
        cmake -S . -B build_asan \
          -DLLOYAL_BUILD_INTEGRATION_TESTS=ON \
          -DLLAMA_CPP_DIR=${{ github.workspace }}/llama.cpp \
          -DLLAMA_CPP_BUILD_DIR=${{ github.workspace }}/llama.cpp/build-asan \
          -DNLOHMANN_JSON_DIR=/usr/include \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          "-DCMAKE_CXX_FLAGS=-fsanitize=address -fno-omit-frame-pointer" \
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address"
        cmake --build build_asan --target IntegrationRunner -j$(nproc)

    # Leaks are the stub job's to find: this runner keeps the model loaded in a
    # static for the whole suite on purpose, so a leak report here is noise.
    - name: Branch operations under ASan (SmolLM2, attention-only)
      working-directory: tests
      env:
        LLAMA_TEST_MODEL: ${{ github.workspace }}/tests/fixtures/SmolLM2-1.7B-Instruct-Q4_K_M.gguf
        LLAMA_N_GPU_LAYERS: "0"
        ASAN_OPTIONS: halt_on_error=1:detect_leaks=0:print_stacktrace=1
      run: |
        set -o pipefail
        ./build_asan/IntegrationRunner --success \
          --test-case="fast forward:*,fork fidelity:*,branch integration:*,branch scoping:*,decode failure:*" \
          --test-case-exclude="decode failure: an image*" 2>&1 | tee asan_smollm.txt
        if ! grep -qE 'test cases:.*\| +[1-9][0-9]* passed \| +0 failed \|' asan_smollm.txt; then
          echo "::error::No passing cases were reported"
          exit 1
        fi

    - name: Branch operations under ASan (Qwen3.5, hybrid recurrent, with its projector)
      working-directory: tests
      env:
        LLAMA_TEST_MODEL: ${{ github.workspace }}/tests/fixtures/Qwen3.5-4B-Q4_K_M.gguf
        LLAMA_MMPROJ_MODEL: ${{ github.workspace }}/tests/fixtures/mmproj-F16.gguf
        LLAMA_N_GPU_LAYERS: "0"
        LLOYAL_VL_STRICT: "1"
        ASAN_OPTIONS: halt_on_error=1:detect_leaks=0:print_stacktrace=1
      run: |
        set -o pipefail
        ./build_asan/IntegrationRunner --success \
          --test-case="fast forward:*,decode failure:*,multimodal: a fast-forwarded*,multimodal: a cohort*,multimodal: a prepared video*" \
          2>&1 | tee asan_qwen.txt
        if ! grep -qE 'test cases:.*\| +[1-9][0-9]* passed \| +0 failed \|' asan_qwen.txt; then
          echo "::error::No passing cases were reported"
          exit 1
        fi

  lint:
    name: Code Style Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install clang-format
      run: sudo apt-get update && sudo apt-get install -y clang-format

    - name: Check formatting
      run: |
        # Exclude build artifacts from formatting checks
        find include/ tests/ \( -name '*.hpp' -o -name '*.cpp' \) \
          -not -path '*/build/*' \
          -not -path '*/build_*/*' \
          -not -path '*/_deps/*' \
          -not -path '*/lib/*' \
          -exec clang-format --dry-run --Werror {} \; || exit 1

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, sanitizer-tests, integration-tests, integration-asan, lint]
    if: always()

    steps:
    - name: Check test results
      run: |
        echo "=== Test Results ==="
        echo "Unit Tests: ${{ needs.unit-tests.result }}"
        echo "Sanitizer Tests: ${{ needs.sanitizer-tests.result }}"
        echo "Integration Tests (Linux): ${{ needs.integration-tests.result }}"
        echo "Integration Tests under ASan (Linux): ${{ needs.integration-asan.result }}"
        echo "Lint: ${{ needs.lint.result }}"

        FAILED=0

        if [ "${{ needs.unit-tests.result }}" != "success" ]; then
          echo "❌ Unit tests failed"
          FAILED=1
        fi

        if [ "${{ needs.sanitizer-tests.result }}" != "success" ]; then
          echo "❌ Sanitizer tests failed (memory bugs, UB, leaks, or overflow detected)"
          FAILED=1
        fi

        if [ "${{ needs.integration-tests.result }}" != "success" ]; then
          echo "❌ Integration tests failed"
          FAILED=1
        fi

        if [ "${{ needs.integration-asan.result }}" != "success" ]; then
          echo "❌ Integration tests under ASan failed (memory errors on real weights)"
          FAILED=1
        fi

        if [ "${{ needs.lint.result }}" != "success" ]; then
          echo "❌ Lint failed (code style issues)"
          FAILED=1
        fi

        if [ "$FAILED" = "1" ]; then
          exit 1
        else
          echo "✅ All tests passed"
        fi